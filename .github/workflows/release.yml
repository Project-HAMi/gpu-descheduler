name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: read

concurrency:
  group: gpu-descheduler-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Compute metadata
        id: meta
        run: |
          FULL_TAG="${GITHUB_REF#refs/tags/}"    # v1.0.0
          VERSION="${GITHUB_REF#refs/tags/v}"     # 1.0.0
          {
            echo "version=${VERSION}"
            echo "full_tag=${FULL_TAG}"
            echo "chart_version=${VERSION}-chart"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Package and push chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          FULL_TAG: ${{ steps.meta.outputs.full_tag }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
        run: |
          CHART_DIR="chart"

          sed -i "s/^version:.*/version: ${CHART_VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^  tag:.*/  tag: ${FULL_TAG}/" "${CHART_DIR}/values.yaml"

          helm package "${CHART_DIR}" --version "${CHART_VERSION}"

          helm push "gpu-descheduler-webhook-${CHART_VERSION}.tgz" oci://docker.io/projecthami

  docker:
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Compute metadata
        id: meta
        run: |
          FULL_TAG="${GITHUB_REF#refs/tags/}"    # v1.0.0
          REPO="docker.io/projecthami/gpu-descheduler-webhook"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tags=${REPO}:${FULL_TAG},${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max

      - name: Sign image
        env:
          IMAGE: ${{ steps.meta.outputs.repo }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"
