{{- if and (not (and .Values.certManager .Values.certManager.enabled)) (and .Values.patch .Values.patch.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}-patch
  namespace: {{ include "gpu-descheduler-webhook.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
spec:
  template:
    metadata:
      name: {{ include "gpu-descheduler-webhook.fullname" . }}-patch
      labels:
        {{- include "gpu-descheduler-webhook.labels" . | nindent 8 }}
        app.kubernetes.io/component: admission-webhook
    spec:
      serviceAccountName: {{ include "gpu-descheduler-webhook.admissionServiceAccount" . }}
      restartPolicy: OnFailure
      activeDeadlineSeconds: 300
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: {{ include "gpu-descheduler-webhook.certgenImage" . | quote }}
          imagePullPolicy: {{ (.Values.patch.image | default dict).pullPolicy | default "IfNotPresent" }}
          args:
            - patch
            - --webhook-name={{ include "gpu-descheduler-webhook.fullname" . }}
            - --namespace={{ include "gpu-descheduler-webhook.namespace" . }}
            - --patch-validating=false
            - --secret-name=gpu-descheduler-webhook-tls
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsUser: {{ .Values.patch.runAsUser | default 2000 }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}