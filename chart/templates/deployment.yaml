apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}
  namespace: {{ include "gpu-descheduler-webhook.namespace" . }}
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}
{{- /* patch.* held the Pod settings while certgen Jobs shared them; still read for upgrades */ -}}
{{- $patch := .Values.patch | default dict }}
{{- $podAnnotations := .Values.podAnnotations | default $patch.podAnnotations }}
{{- $priorityClassName := .Values.priorityClassName | default $patch.priorityClassName }}
{{- $nodeSelector := .Values.nodeSelector | default $patch.nodeSelector }}
{{- $tolerations := .Values.tolerations | default $patch.tolerations }}
spec:
  {{- if gt (int (.Values.replicaCount | default 1)) 1 }}
  {{- fail "replicaCount must be 1: placements are matched in the leader's memory, so a second replica would admit Pods without them" }}
  {{- end }}
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "gpu-descheduler-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu-descheduler-webhook.selectorLabels" . | nindent 8 }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gpu-descheduler-webhook.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: {{ include "gpu-descheduler-webhook.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.args }}
          args: {{- toYaml .Values.args | nindent 12 }}
          {{- else }}
          args:
            - --tls-dir=/etc/webhook/certs
            - --port=8443
            - --enable-leader-election=true
          {{- end }}
          {{- if include "gpu-descheduler-webhook.manageCerts" . }}
            - --cert-secret={{ include "gpu-descheduler-webhook.certSecret" . }}
            - --webhook-service={{ include "gpu-descheduler-webhook.fullname" . }}
            - --webhook-config={{ include "gpu-descheduler-webhook.fullname" . }}
          {{- else }}
            - --manage-certs=false
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: {{ .Values.webhookPort | default 8443 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/webhook/certs
              {{- if not (include "gpu-descheduler-webhook.manageCerts" .) }}
              readOnly: true
              {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.probePort | default 8081 }}
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.probePort | default 8081 }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- with .Values.resources }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
      {{- with $priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tls
          {{- if include "gpu-descheduler-webhook.manageCerts" . }}
          # The descheduler writes the certificate from its Secret here.
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          {{- else }}
          secret:
            secretName: {{ include "gpu-descheduler-webhook.certSecret" . }}
          {{- end }}
