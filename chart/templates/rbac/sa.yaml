apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}