apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}
rules:
# CRD read/write/watch
- apiGroups: ["scheduling.hami.placement.com"]
  resources: ["hamipodplacements"]
  verbs: ["get","list","watch","create","update","patch","delete"]
# CRD Status subresource (critical for status updates)
- apiGroups: ["scheduling.hami.placement.com"]
  resources: ["hamipodplacements/status"]
  verbs: ["get","update","patch"]
# Pod query and delete
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch","delete"]
# Pod Eviction permission - critical for handleEvictPod
# Note: Eviction is a subresource of Pod, in the core API group ("") not the policy group
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
# Nodes and PodDisruptionBudgets, read by GPU defragmentation for HAMi's
# GPU registration, scheduling rules and disruption budgets
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get","list","watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get","list","watch"]
# Controllers of moved pods, whose selectors match their replacement pods
- apiGroups: ["apps"]
  resources: ["replicasets","statefulsets"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
# HAMi scheduler discovery: the Service's metrics port, or a ready endpoint as fallback
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
# Leader election leases
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create","get","list","watch","update","patch"]
# Events (required by Leader Election)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create","patch"]