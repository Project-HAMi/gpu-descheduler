apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hamipodplacements.scheduling.hami.placement.com
spec:
  group: scheduling.hami.placement.com
  names:
    kind: HamiPodPlacement
    listKind: HamiPodPlacementList
    plural: hamipodplacements
    singular: hamipodplacement
    shortNames:
      - vcp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["reqID","podSelector","nodeName","gpuDevices"]
              properties:
                reqID:
                  type: string
                  minLength: 5
                  description: "Request ID cannot be empty"
                podSelector:
                  type: object
                  minProperties: 1
                  description: "Pod selector is required and must contain at least matchLabels or matchExpressions"
                  anyOf:
                    - required: ["matchLabels"]
                    - required: ["matchExpressions"]
                  properties:
                    matchLabels:
                      type: object
                      minProperties: 1
                      description: "Label matching criteria (at least one label required)"
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      minItems: 1
                      description: "Expression-based label selector (at least one expression required)"
                      items:
                        type: object
                        required: ["key", "operator"]
                        properties:
                          key:
                            type: string
                            minLength: 1
                            description: "Label key to select (required)"
                          operator:
                            type: string
                            enum: ["In", "NotIn", "Exists", "DoesNotExist"]
                            description: "Selection operator (required)"
                          values:
                            type: array
                            items:
                              type: string
                            description: "Values for In/NotIn operators (required when operator is In or NotIn)"
                nodeName:
                  type: string
                  minLength: 1
                  pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$)"
                  description: "Node name is required and must be a valid Kubernetes node name (DNS subdomain format)"
                gpuDevices:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: "^gpu-[0-9]+(/([1-9][0-9]?|100))?$"
                    description: "GPU device specification in format 'gpu-<index>' or 'gpu-<index>/<core-percentage>' (e.g., gpu-0, gpu-1/70)"
                evictPod:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "EvictingOldPod", "Matched", "PartiallyCompleted", "Completed", "Failed"]
                assignmentDetails:
                  type: array
                  description: "Records each scheduled Pod and its assigned GPU"
                  items:
                    type: object
                    properties:
                      podName:
                        type: string
                      gpuDevice:
                        type: string
                consumedAt:
                  type: string
                  format: date-time
                message:
                  type: string
                matchedPodName:
                  type: string
                  description: "Pod name precisely matched via Admission-UID. Populated by ObservationCache only after Pod is running successfully"