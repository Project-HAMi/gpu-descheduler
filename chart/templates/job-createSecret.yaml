{{- if and (not (and .Values.certManager .Values.certManager.enabled)) (and .Values.patch .Values.patch.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}-create-secret
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-creation
spec:
  template:
    metadata:
      name: {{ include "gpu-descheduler-webhook.fullname" . }}-create-secret
      labels:
        {{- include "gpu-descheduler-webhook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-creation
    spec:
      serviceAccountName: {{ include "gpu-descheduler-webhook.fullname" . }}
      restartPolicy: OnFailure
      activeDeadlineSeconds: 300
      containers:
        - name: create-secret
          {{- if and .Values.patch .Values.patch.image }}
          image: "{{ .Values.patch.image.registry | default "docker.io" }}/{{ .Values.patch.image.repository | default "liangjw/kube-webhook-certgen" }}:{{ .Values.patch.image.tag | default "v1.1.1" }}"
          imagePullPolicy: {{ .Values.patch.image.pullPolicy | default "IfNotPresent" }}
          {{- else }}
          image: "docker.io/liangjw/kube-webhook-certgen:v1.1.1"
          imagePullPolicy: IfNotPresent
          {{- end }}
          args:
            - create
            - --cert-name=tls.crt
            - --key-name=tls.key
            - --host={{ include "gpu-descheduler-webhook.fullname" . }},{{ include "gpu-descheduler-webhook.fullname" . }}.{{ .Values.namespace }},{{ include "gpu-descheduler-webhook.fullname" . }}.{{ .Values.namespace }}.svc,{{ include "gpu-descheduler-webhook.fullname" . }}.{{ .Values.namespace }}.svc.cluster.local
            - --namespace={{ .Values.namespace }}
            - --secret-name=gpu-descheduler-webhook-tls
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsUser: {{ .Values.patch.runAsUser | default 2000 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}