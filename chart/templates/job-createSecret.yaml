{{- if and (not (and .Values.certManager .Values.certManager.enabled)) (and .Values.patch .Values.patch.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}-create-secret
  namespace: {{ include "gpu-descheduler-webhook.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-creation
spec:
  template:
    metadata:
      name: {{ include "gpu-descheduler-webhook.fullname" . }}-create-secret
      labels:
        {{- include "gpu-descheduler-webhook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-creation
    spec:
      serviceAccountName: {{ include "gpu-descheduler-webhook.admissionServiceAccount" . }}
      restartPolicy: OnFailure
      activeDeadlineSeconds: 300
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-secret
          image: {{ include "gpu-descheduler-webhook.certgenImage" . | quote }}
          imagePullPolicy: {{ (.Values.patch.image | default dict).pullPolicy | default "IfNotPresent" }}
          args:
            - create
            - --cert-name=tls.crt
            - --key-name=tls.key
            - --host={{ include "gpu-descheduler-webhook.fullname" . }},{{ include "gpu-descheduler-webhook.fullname" . }}.{{ include "gpu-descheduler-webhook.namespace" . }},{{ include "gpu-descheduler-webhook.fullname" . }}.{{ include "gpu-descheduler-webhook.namespace" . }}.svc,{{ include "gpu-descheduler-webhook.fullname" . }}.{{ include "gpu-descheduler-webhook.namespace" . }}.svc.cluster.local
            - --namespace={{ include "gpu-descheduler-webhook.namespace" . }}
            - --secret-name=gpu-descheduler-webhook-tls
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsUser: {{ .Values.patch.runAsUser | default 2000 }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}