apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "gpu-descheduler-webhook.fullname" . }}
  labels:
    {{- include "gpu-descheduler-webhook.labels" . | nindent 4 }}
webhooks:
  - name: defrag.pre.hami.io
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    {{- if .Values.webhook }}
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy | default "IfNeeded" }}
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Ignore" }}
    {{- else }}
    reinvocationPolicy: IfNeeded
    failurePolicy: Ignore
    {{- end }}
    sideEffects: None
    timeoutSeconds: 30
    admissionReviewVersions: ["v1", "v1beta1"]
    clientConfig:
      service:
        namespace: {{ .Values.namespace }}
        name: {{ include "gpu-descheduler-webhook.fullname" . }}
        path: /mutate
      # Do not specify port, let Kubernetes auto-use the Service default port (443)
      # caBundle is auto-filled by Post-Install Patch Job (Cert-Gen approach, consistent with HAMI)