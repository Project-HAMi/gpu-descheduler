# GPU Descheduler Webhook Production Config
# The descheduler issues and renews its own webhook certificate (no cert-manager needed)

# ============================================================
# Namespace
# ============================================================
# Empty installs into the release namespace (helm install -n <namespace>).
namespace: ""

# ============================================================
# Image Config
# ============================================================
image:
  registry: docker.io
  repository: projecthami/gpu-descheduler-webhook
  # Empty uses the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# If Harbor requires auth, uncomment and configure:
# imagePullSecrets:
#   - name: harbor-credentials

# ============================================================
# Replicas
# ============================================================
# Must be 1: the webhook matches placements from the leader's memory.
replicaCount: 1

# ============================================================
# Container Args
# ============================================================
args:
  - --tls-dir=/etc/webhook/certs
  - --port=8443
  - --metrics-bind-address=:8080
  - --scheduler-port=9395  # Scheduler metrics port (default 9395, IP auto-discovered)
  - --sync-interval=60s
  - --enable-leader-election=true
  - --v=3  # Log level: 0=Info, 3=Debug, 4=Verbose, 5=Trace

# ============================================================
# Resource Limits
# ============================================================
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# ============================================================
# Port Config
# ============================================================
webhookPort: 8443       # Webhook HTTPS port (must match --port arg)
probePort: 8081         # Health check port

# ============================================================
# Pod Scheduling
# ============================================================
podAnnotations: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []

# ============================================================
# Cert-Manager Config
# ============================================================
# By default the descheduler keeps a self-signed CA and its serving
# certificate in the <fullname>-cert Secret, renews them, and injects the CA
# into the webhook configuration. Enable this to take the certificate from
# cert-manager instead, issued by the given ClusterIssuer.
certManager:
  enabled: false
  issuerName: selfsigned-cluster-issuer
  secretName: gpu-descheduler-webhook-tls

# ============================================================
# Webhook Admission Policy
# ============================================================
webhook:
  failurePolicy: Ignore      # Ignore (allow Pod creation on error) or Fail (reject on error)
  reinvocationPolicy: IfNeeded

# ============================================================
# Other Config
# ============================================================
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""