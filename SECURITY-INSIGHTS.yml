header:
  schema-version: 2.0.0
  last-updated: '2026-11-24'
  last-reviewed: '2026-11-24'
  url: https://github.com/Project-HAMi/gpu-descheduler/blob/main/SECURITY-INSIGHTS.yml
  comment: |
    Security metadata for gpu-descheduler, following the OpenSSF
    Security Insights specification.

project:
  name: gpu-descheduler
  homepage: https://project-hami.io
  documentation:
    code-of-conduct: https://github.com/Project-HAMi/community/blob/main/CODE-OF-CONDUCT.md
  administrators:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
  repositories:
    - name: gpu-descheduler
      url: https://github.com/Project-HAMi/gpu-descheduler
      comment: |
        Mutating webhook and controller that moves HAMi vGPU Pods to
        chosen nodes and devices to reduce GPU fragmentation.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: gpu-descheduler maintainers
      primary: true
    policy: https://github.com/Project-HAMi/gpu-descheduler/blob/main/SECURITY.md
    comment: |
      Report vulnerabilities privately through GitHub Security
      Advisories. See SECURITY.md.

repository:
  url: https://github.com/Project-HAMi/gpu-descheduler
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: Li Mengxuan
      affiliation: dynamia.ai
      email: archlitchi@gmail.com
      primary: true
  documentation:
    contributing-guide: https://github.com/Project-HAMi/gpu-descheduler/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/Project-HAMi/gpu-descheduler/blob/main/SECURITY.md
    governance: https://github.com/Project-HAMi/community/blob/main/governance.md
  license:
    url: https://github.com/Project-HAMi/gpu-descheduler/blob/main/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        comment: |
          Dependabot keeps dependencies current. Every pull request runs
          tests, lint, govulncheck, CodeQL and fuzz tests for the input
          parsers. main needs green checks and one review. Actions are
          pinned to commit SHAs and base images to digests. Release
          images are signed with cosign and ship an SBOM. GitHub
          releases carry the chart package and its cosign bundle.
    tools:
      - name: Dependabot
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Weekly update pull requests for Go modules, the Dockerfile
          and GitHub Actions.
      - name: GitHub secret scanning
        type: secret
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Native secret scanning with push protection enabled on the
          repository.
      - name: govulncheck
        type: SCA
        version: v1.10.0
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Runs on every pull request with the Go version of the image.
      - name: CodeQL
        type: SAST
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Scans Go code and workflows on every pull request and weekly.
      - name: Go fuzzing
        type: fuzzing
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Fuzzes the HAMi metrics parser and the gpu-N/core device spec
          parser for 60 seconds each on every pull request.
      - name: OpenSSF Scorecard
        type: other
        version: v2.5.0
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Runs weekly and on main. Results are on scorecard.dev.
      - name: cosign
        type: other
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: false
          release: true
        results: {}
        comment: |
          Signs release images and the chart package attached to each
          GitHub release. Buildx adds SBOM and provenance.
