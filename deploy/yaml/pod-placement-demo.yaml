# Move a running Pod to gpu-0 on gpu-node-1.
# The old Pod is evicted only if gpu-0 has room for it.
# The next Pod with app=my-job lands on gpu-0.
apiVersion: scheduling.hami.placement.com/v1
kind: HamiPodPlacement
metadata:
  name: move-my-job
  namespace: default
spec:
  reqID: "move-my-job-001"
  podSelector:
    matchLabels:
      app: my-job
  nodeName: gpu-node-1
  gpuDevices:
    - gpu-0
  evictPod: my-job-6cd5964877-zdb5z
---
# Send the next Pod with app=my-job to gpu-1. Nothing is evicted.
apiVersion: scheduling.hami.placement.com/v1
kind: HamiPodPlacement
metadata:
  name: pin-my-job
  namespace: default
spec:
  reqID: "pin-my-job-001"
  podSelector:
    matchLabels:
      app: my-job
  nodeName: gpu-node-1
  gpuDevices:
    - gpu-1
